[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "w4h-glucose-monitor-csv-file-importer"
version = "0.1.0"
description = "Import Dexcom Clarity and FreeStyle Libre CSV files into W4H via API key"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.28",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.scripts]
w4h-glucose-monitor-csv-file-import = "w4h_glucose_monitor_csv_file_importer.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
notebook = ["ipywidgets>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["w4h_glucose_monitor_csv_file_importer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running w4h-api and W4H_API_KEY"]
